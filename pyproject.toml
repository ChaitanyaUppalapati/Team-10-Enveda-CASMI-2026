# Owner: Member 1. Changes to dependencies need a PR approved by Member 1.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi"
version = "0.1.0"
description = "Team 10 - Enveda CASMI 2026: molecule identification from MS/MS spectra"
readme = "README.md"
requires-python = ">=3.10"
# Core deps are kept light so CI and the Kaggle notebook install fast.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Chemistry: pinned to the version the competition metric uses (InChIKey14 matching).
chem = ["rdkit==2026.3.3"]
# Model training (torch is installed separately on Kaggle; pin locally as needed).
ml = ["torch>=2.2", "lightgbm>=4.3", "scikit-learn>=1.4", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.6", "nbstripout>=0.7"]
all = ["casmi[chem,ml,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F401"]
